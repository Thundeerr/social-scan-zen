services:
  model-worker:
    build:
      context: ../..
      dockerfile: cloud/model-worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - worker-data:/data
      - ./references:/references:ro
    read_only: true
    tmpfs:
      - /tmp:size=256m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 3g
    cpus: 2
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"
volumes:
  worker-data:
